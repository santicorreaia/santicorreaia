<text x="308" y="112" class="serif" font-size="47">De horas</text><text x="308" y="171" class="serif blue" font-size="47">a minutos</text><text x="308" y="222" class="body">Así cambió mi trabajo</text><text x="308" y="258" class="note">en el SENA*</text><rect x="305" y="287" width="364" height="60" rx="12" fill="#E6F5F2"/><text x="322" y="326" class="body" font-size="22">La IA ayuda. Yo reviso.</text>
