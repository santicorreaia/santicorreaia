<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">Dos tareas del SENA, de horas a minutos</title><desc id="desc">El reporte diario pasó de al menos dos horas a unos quince minutos. El acta semanal pasó de al menos tres horas a entre diez y veinte minutos. La IA prepara el borrador y Santiago verifica y edita.</desc><defs><clipPath id="portrait"><rect x="44" y="53" width="238" height="296" rx="17"/></clipPath></defs><rect width="720" height="1280" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0A2540}.serif{font-family:Georgia,serif;font-weight:900}.blue{fill:#1464B0}.label{font-size:22px;font-weight:700;fill:#1464B0}.body{font-size:25px;font-weight:700}.note{font-size:21px;fill:#40566b}.icon{fill:none;stroke:#1464B0;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="44" y="53" width="238" height="296" rx="17" fill="#EAF4FC"/>
<rect x="65" y="88" width="151" height="192" rx="12" fill="#fff" stroke="#A8CAE2" stroke-width="4" transform="rotate(-9 140 184)"/>
<rect x="110" y="118" width="145" height="190" rx="12" fill="#fff" stroke="#A8CAE2" stroke-width="4" transform="rotate(7 182 213)"/>
