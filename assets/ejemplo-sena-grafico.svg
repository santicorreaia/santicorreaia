<path d="M101 163h96m-96 18h77m-77 18h89" stroke="#A8CAE2" stroke-width="8" stroke-linecap="round"/>
<circle cx="180" cy="251" r="46" fill="#22D3C5"/><path d="M159 251l15 15 27-31" fill="none" stroke="#0A2540" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="117" class="serif" font-size="57">De horas</text><text x="308" y="187" class="serif blue" font-size="57">a minutos</text><text x="308" y="244" class="body" font-size="29" font-weight="800">Así cambió mi trabajo</text><text x="308" y="284" class="body" font-size="27" font-weight="800">en el SENA*</text>
<rect x="44" y="386" width="632" height="387" rx="20" fill="white" stroke="#D3E5F1" stroke-width="3"/>
<rect x="65" y="406" width="119" height="33" rx="16" fill="#DDEEFE"/><text x="83" y="430" class="label" font-size="18">NOTICIAS</text>
<text x="64" y="487" class="serif" font-size="34">Reporte diario de noticias</text>
<line x1="114" y1="704" x2="607" y2="704" stroke="#BED4E4" stroke-width="3"/>
<text x="78" y="646" class="serif" font-size="31">≥ 2 horas</text><text x="494" y="646" class="serif blue" font-size="31">≈ 15 min</text>
<rect x="280" y="564" width="62" height="140" rx="10" fill="#829DB3"/><rect x="410" y="684" width="62" height="20" rx="10" fill="#1464B0"/>
<text x="270" y="729" class="body" font-size="21">Antes</text><text x="400" y="729" class="body blue" font-size="21">Ahora</text>
<text x="360" y="761" text-anchor="middle" class="note" font-size="19">Selecciono las noticias, verifico y edito el borrador.</text>
<rect x="44" y="801" width="632" height="387" rx="20" fill="white" stroke="#D3E5F1" stroke-width="3"/>
<rect x="65" y="821" width="119" height="33" rx="16" fill="#DDEEFE"/><text x="83" y="845" class="label" font-size="18">REUNIÓN</text>
<text x="64" y="902" class="serif" font-size="34">Acta semanal de redacción</text>
<line x1="114" y1="1119" x2="607" y2="1119" stroke="#BED4E4" stroke-width="3"/>
<text x="78" y="1061" class="serif" font-size="31">≥ 3 horas</text><text x="491" y="1061" class="serif blue" font-size="29">10–20 min</text>
<rect x="280" y="979" width="62" height="140" rx="10" fill="#829DB3"/><rect x="410" y="1099" width="62" height="20" rx="10" fill="#1464B0"/>
<text x="270" y="1144" class="body" font-size="21">Antes</text><text x="400" y="1144" class="body blue" font-size="21">Ahora</text>
<text x="360" y="1176" text-anchor="middle" class="note" font-size="19">Reviso nombres, decisiones y acuerdos del acta.</text>
<text x="49" y="1230" class="note" font-size="19">*Servicio Nacional de Aprendizaje, entidad pública de Colombia.</text><text x="49" y="1258" class="note" font-size="18">Tiempos aproximados según mi experiencia.</text></svg>