<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">De la idea a una página sobre discapacidad</title><desc id="desc">Santiago escucha una idea, ordena el contenido para su público y muestra una propuesta de página.</desc><defs><clipPath id="portrait"><rect x="44" y="53" width="250" height="382" rx="17"/></clipPath></defs><rect width="720" height="1280" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0A2540}.serif{font-family:Georgia,serif;font-weight:700}.blue{fill:#1464B0}.label{font-size:21px;font-weight:700;fill:#1464B0}.copy{font-size:25px;font-weight:600}.icon{fill:none;stroke:#1464B0;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}</style>
